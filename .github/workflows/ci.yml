name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instalacion reproducible: respeta el lockfile
      - run: npm ci --legacy-peer-deps

      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (SEO, seguridad, accesibilidad, formularios)
        run: npm run e2e
        env:
          CI: "1"

      - name: Presupuesto de bundle
        run: |
          E2E_MOCK_DELIVERY=1 npx next start -p 3211 &
          npx wait-on http://localhost:3211
          npm run budget

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
